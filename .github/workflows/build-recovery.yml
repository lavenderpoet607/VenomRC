name: Build TWRP Recovery for Samsung Galaxy A05

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space and Setup Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig tar libssl-dev bc rsync python3

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize TWRP Manifest
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          git config --global user.name "Builder"
          git config --global user.email "builder@local"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)

      - name: Clone Device Tree
        run: |
          cd ~/twrp
          git clone https://github.com/${{ github.repository }}.git -b ${{ github.ref_name }} device/samsung/a05
          ls -la device/samsung/a05

      - name: Prepare Dummy Kernel Fallback If Missing
        run: |
          mkdir -p ~/twrp/device/samsung/a05/prebuilt
          if [ ! -f ~/twrp/device/samsung/a05/prebuilt/kernel ]; then
            touch ~/twrp/device/samsung/a05/prebuilt/kernel
          fi
          if [ ! -f ~/twrp/device/samsung/a05/prebuilt/dtb.img ]; then
            touch ~/twrp/device/samsung/a05/prebuilt/dtb.img
          fi

      - name: Patch Build Rules and Exclude Conflicts
        run: |
          cd ~/twrp
          sed -i 's/rsync -a /rsync -a --force /g' build/make/core/Makefile 2>/dev/null || true
          sed -i 's/--exclude=cache/--exclude=cache --exclude=\/root\/vendor --exclude=\/root\/product --exclude=\/root\/system_ext --exclude=\/root\/odm/g' build/make/core/Makefile 2>/dev/null || true
          if [ -d bootable/recovery ]; then
            sed -i 's/rsync -a /rsync -a --force /g' $(grep -rl "rsync -a" bootable/recovery/ 2>/dev/null || true) 2>/dev/null || true
          fi
          rm -rf out/target/product/a05/recovery/root/vendor 2>/dev/null || true

      - name: Compile TWRP Recovery Image
        run: |
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export GOGC=50
          lunch twrp_a05-eng || lunch omni_a05-eng
          rm -rf out/target/product/a05/recovery/root/vendor 2>/dev/null || true
          mka recoveryimage -j$(nproc --all)

      - name: Package Odin Tar Archive
        run: |
          cd ~/twrp/out/target/product/a05
          tar -cvf recovery.tar recovery.img
          sha256sum recovery.tar > recovery.tar.sha256
          ls -la recovery.tar

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-a05-odin
          path: |
            ~/twrp/out/target/product/a05/recovery.img
            ~/twrp/out/target/product/a05/recovery.tar
            ~/twrp/out/target/product/a05/recovery.tar.sha256
